services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: >
      bash -c "bundle install &&
      bundle exec jekyll serve
      --config _config.yml,_config.local.yml
      --host 0.0.0.0
      --force_polling"
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle

volumes:
  bundle_cache: