<script>
  document.addEventListener("DOMContentLoaded", function () {
    var boxes = document.querySelectorAll(".main-content input[type='checkbox']");

    boxes.forEach(function (box, i) {
      // One key per page and checkbox
      var key = "checkliste:" + location.pathname + ":" + i;

      // Make the box clickable
      box.disabled = false;
      box.removeAttribute("disabled");

      // Restore the saved state
      var saved = localStorage.getItem(key);
      if (saved !== null) {
        box.checked = saved === "1";
      }

      // Save when clicked
      box.addEventListener("change", function () {
        localStorage.setItem(key, box.checked ? "1" : "0");
      });
    });
  });
</script>

<style>
  .main-content input[type="checkbox"] {
    cursor: pointer;
    transform: scale(1.2);
    margin-right: 0.4em;
  }
</style>
<script>
  // Restore the state right away so the page doesn't flicker
  if (localStorage.getItem("sidebar-collapsed") === "1") {
    document.documentElement.classList.add("sidebar-collapsed");
  }

  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.createElement("button");
    btn.className = "sidebar-toggle";
    btn.type = "button";

    function updateLabel() {
      var collapsed = document.documentElement.classList.contains("sidebar-collapsed");
      btn.textContent = collapsed ? "☰ Menü" : "« Menü ausblenden";
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    }

    btn.addEventListener("click", function () {
      var collapsed = document.documentElement.classList.toggle("sidebar-collapsed");
      localStorage.setItem("sidebar-collapsed", collapsed ? "1" : "0");
      updateLabel();
    });

    updateLabel();
    document.body.appendChild(btn);
  });
</script>

<style>
  /* The button, bottom left so it doesn't cover the search */
  .sidebar-toggle {
    position: fixed;
    bottom: 1rem;
    left: 1rem;
    z-index: 1000;
    padding: 0.4rem 0.8rem;
    border: 1px solid #44434d;
    border-radius: 6px;
    background: #27262b;
    color: #e6e1e8;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .sidebar-toggle:hover { background: #302d36; }

  /* Only on wide screens. Small screens keep the theme's own ☰ button */
  @media (max-width: 49.99rem) {
    .sidebar-toggle { display: none; }
  }

  @media (min-width: 50rem) {
    html.sidebar-collapsed .side-bar {
      display: none !important;
    }
    html.sidebar-collapsed .main {
      margin-left: 0 !important;
      max-width: none !important;
    }
  }
</style>
<script>
  (function () {
    var KEY = "color-theme";

    // Find the theme's stylesheet (just-the-docs-default/-light/-dark.css)
    function findStylesheet() {
      return document.querySelector('link[rel="stylesheet"][href*="just-the-docs-"]');
    }

    function applyTheme(theme) {
      var link = findStylesheet();
      if (link) {
        link.href = link.href.replace(
          /just-the-docs-[a-z]+\.css/,
          "just-the-docs-" + theme + ".css"
        );
      }
      document.documentElement.setAttribute("data-theme", theme);
    }

    // Restore the saved choice right away so the page doesn't flash
    var saved = localStorage.getItem(KEY);
    if (saved) {
      applyTheme(saved);
    } else {
      document.documentElement.setAttribute("data-theme", "dark"); // matches color_scheme: dark
    }

    document.addEventListener("DOMContentLoaded", function () {
      var btn = document.createElement("button");
      btn.className = "theme-toggle";
      btn.type = "button";

      function updateLabel() {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        btn.textContent = isDark ? "☀️ Hell" : "🌙 Dunkel";
        btn.setAttribute("aria-label", isDark ? "Helles Design aktivieren" : "Dunkles Design aktivieren");
      }

      btn.addEventListener("click", function () {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        var next = isDark ? "light" : "dark";
        applyTheme(next);
        localStorage.setItem(KEY, next);
        updateLabel();
      });

      updateLabel();
      document.body.appendChild(btn);
    });
  })();
</script>

<style>
  /* Bottom right, so it doesn't overlap the sidebar button on the left */
  .theme-toggle {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 1000;
    padding: 0.4rem 0.8rem;
    border: 1px solid #44434d;
    border-radius: 6px;
    background: #27262b;
    color: #e6e1e8;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .theme-toggle:hover { background: #302d36; }

  /* Light mode colors for both buttons */
  html[data-theme="light"] .theme-toggle,
  html[data-theme="light"] .sidebar-toggle {
    background: #f5f6fa;
    color: #27262b;
    border-color: #d3d6de;
  }
  html[data-theme="light"] .theme-toggle:hover,
  html[data-theme="light"] .sidebar-toggle:hover {
    background: #e6e8ef;
  }
</style>
